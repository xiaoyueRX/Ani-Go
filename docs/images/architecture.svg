<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .badge-text { font-family: monospace; font-size: 11px; font-weight: 600; }
    .layer-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 700; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 600; fill: #f1f5f9; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10.5px; fill: #94a3b8; }
    .step-num { font-family: monospace; font-size: 12px; font-weight: 700; }
    .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; fill: #ecfdf5; }
    .step-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #a7f3d0; }
    .protocol-text { font-family: monospace; font-size: 11px; font-weight: 600; fill: #38bdf8; }
  </style>

  <!-- Canvas Background -->
  <rect width="980" height="620" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(32, 28)">
    <text x="0" y="20" class="title">Ani-Go 系统全景架构设计图</text>
    <text x="0" y="38" class="subtitle">微内核五步闭环 • 模块化插件解耦 • MCP 智能体协议 • 纯 Go 零依赖</text>
    
    <!-- Top Badges -->
    <g transform="translate(620, 4)">
      <rect x="0" y="0" width="82" height="22" rx="6" fill="#065f46" fill-opacity="0.4" stroke="#10b981" stroke-width="1"/>
      <text x="41" y="15" text-anchor="middle" fill="#34d399" class="badge-text">Microkernel</text>

      <rect x="90" y="0" width="105" height="22" rx="6" fill="#312e81" fill-opacity="0.4" stroke="#6366f1" stroke-width="1"/>
      <text x="142" y="15" text-anchor="middle" fill="#a5b4fc" class="badge-text">MCP Native</text>

      <rect x="203" y="0" width="95" height="22" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="250" y="15" text-anchor="middle" fill="#cbd5e1" class="badge-text">RAM: 15~30M</text>
    </g>
  </g>

  <!-- ==================== LAYER 1: CLIENTS & AGENTS ==================== -->
  <g transform="translate(32, 82)">
    <rect width="916" height="88" rx="12" fill="#0f172a" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <text x="16" y="24" class="layer-title" fill="#60a5fa">1. 外部交互终端与智能体 (Clients &amp; AI Agents)</text>
    
    <!-- 4 Client Cards -->
    <g transform="translate(16, 34)">
      <!-- Claude Desktop -->
      <rect x="0" y="0" width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="0.8" />
      <text x="12" y="19" class="card-title">🤖 Claude Desktop</text>
      <text x="12" y="33" class="card-desc">自然语言全局追番与运维</text>

      <!-- Cursor / IDE -->
      <rect x="224" y="0" width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="0.8" />
      <text x="236" y="19" class="card-title">💻 Cursor / IDE</text>
      <text x="236" y="33" class="card-desc">开发者环境与调试控制</text>

      <!-- Dify / Mobile Agent -->
      <rect x="448" y="0" width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="0.8" />
      <text x="460" y="19" class="card-title">📱 移动端 Agent / Dify</text>
      <text x="460" y="33" class="card-desc">微信/TG 远程语音触控</text>

      <!-- Vue 3 Web UI -->
      <rect x="672" y="0" width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#10b981" stroke-width="0.8" />
      <text x="684" y="19" class="card-title">🌐 响应式 Web 控制台</text>
      <text x="684" y="33" class="card-desc">Vue 3 + PWA 沉浸式界面</text>
    </g>
  </g>

  <!-- ==================== PROTOCOL BRIDGE ==================== -->
  <g transform="translate(32, 178)">
    <line x1="458" y1="0" x2="458" y2="22" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3,3" />
    <rect x="288" y="3" width="340" height="20" rx="10" fill="#0c4a6e" fill-opacity="0.8" stroke="#0284c7" stroke-width="1"/>
    <text x="458" y="17" text-anchor="middle" class="protocol-text">▼ SSE over HTTP (Bearer Token) + RESTful API ▼</text>
  </g>

  <!-- ==================== LAYER 2: MCP GATEWAY ==================== -->
  <g transform="translate(32, 208)">
    <rect width="916" height="84" rx="12" fill="url(#mcpGrad)" stroke="#4f46e5" stroke-width="1.2" />
    <text x="16" y="24" class="layer-title" fill="#a5b4fc">2. Ani-Go MCP 智能体控制中枢 (Model Context Protocol Gateway)</text>
    <text x="896" y="24" text-anchor="end" font-family="monospace" font-size="11" fill="#818cf8">/mcp/sse &amp; /mcp/messages</text>

    <!-- 3 Tool Buckets -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="286" height="38" rx="7" fill="#0f172a" fill-opacity="0.85" stroke="#4338ca" stroke-width="0.8"/>
      <text x="12" y="17" class="card-title" fill="#c7d2fe">📺 业务工具 (Anime Ops)</text>
      <text x="12" y="30" class="card-desc">search_anime, add_sub, list_subs, get_downloads</text>

      <rect x="300" y="0" width="286" height="38" rx="7" fill="#0f172a" fill-opacity="0.85" stroke="#4338ca" stroke-width="0.8"/>
      <text x="312" y="17" class="card-title" fill="#c7d2fe">🛠️ 治理工具 (Governance)</text>
      <text x="312" y="30" class="card-desc">list_plugins, toggle_plugin, set_config, sys_status</text>

      <rect x="600" y="0" width="284" height="38" rx="7" fill="#0f172a" fill-opacity="0.85" stroke="#4338ca" stroke-width="0.8"/>
      <text x="612" y="17" class="card-title" fill="#c7d2fe">🔌 动态挂载工具 (Dynamic)</text>
      <text x="612" y="30" class="card-desc">随插件启用自动暴露，插件停用即刻下架</text>
    </g>
  </g>

  <!-- ==================== DOWN ARROW TO CORE ==================== -->
  <g transform="translate(490, 296)">
    <line x1="0" y1="0" x2="0" y2="16" stroke="#10b981" stroke-width="2" />
    <polygon points="-4,14 0,20 4,14" fill="#10b981" />
  </g>

  <!-- ==================== LAYER 3: MICROKERNEL CORE (5 STEPS) ==================== -->
  <g transform="translate(32, 320)">
    <rect width="916" height="136" rx="14" fill="url(#coreGrad)" stroke="#10b981" stroke-width="1.8" />
    <text x="18" y="26" class="layer-title" fill="#34d399">3. 微内核核心主干流水线 (Microkernel Core Pipeline - 纯 Go 实现)</text>
    <text x="896" y="26" text-anchor="end" font-family="monospace" font-size="11" fill="#6ee7b7">内存 15~30MB • 空载 CPU 0.0% • 极速闭环</text>

    <!-- 5 Steps Flow -->
    <g transform="translate(14, 38)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="162" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <circle cx="22" cy="20" r="11" fill="#047857"/>
        <text x="22" y="24" text-anchor="middle" fill="#ffffff" class="step-num">1</text>
        <text x="40" y="24" class="step-title">订阅源抓取</text>
        <text x="12" y="44" class="step-desc">Mikan / Bangumi</text>
        <text x="12" y="58" class="step-desc">多镜像自动测速回退</text>
        <text x="12" y="70" class="step-desc" fill="#6ee7b7" font-weight="600">15s 探针 / 防抖</text>
      </g>

      <!-- Connector 1->2 -->
      <path d="M 166 39 L 178 39" stroke="#34d399" stroke-width="2" marker-end="url(#arrowhead)"/>
      <polygon points="177,36 182,39 177,42" fill="#34d399" />

      <!-- Step 2 -->
      <g transform="translate(182, 0)">
        <rect width="162" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <circle cx="22" cy="20" r="11" fill="#047857"/>
        <text x="22" y="24" text-anchor="middle" fill="#ffffff" class="step-num">2</text>
        <text x="40" y="24" class="step-title">三级消歧解析</text>
        <text x="12" y="44" class="step-desc">正则 + 放送日历比对</text>
        <text x="12" y="58" class="step-desc">上下文 LLM 兜底</text>
        <text x="12" y="70" class="step-desc" fill="#6ee7b7" font-weight="600">0 Token 化解 95%</text>
      </g>

      <!-- Connector 2->3 -->
      <polygon points="348,36 353,39 348,42" fill="#34d399" />
      <line x1="346" y1="39" x2="352" y2="39" stroke="#34d399" stroke-width="2" />

      <!-- Step 3 -->
      <g transform="translate(353, 0)">
        <rect width="162" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <circle cx="22" cy="20" r="11" fill="#047857"/>
        <text x="22" y="24" text-anchor="middle" fill="#ffffff" class="step-num">3</text>
        <text x="40" y="24" class="step-title">下载器调度</text>
        <text x="12" y="44" class="step-desc">qB / Aria2 / TR</text>
        <text x="12" y="58" class="step-desc">做种配额管控与清理</text>
        <text x="12" y="70" class="step-desc" fill="#6ee7b7" font-weight="600">支持运行时热切换</text>
      </g>

      <!-- Connector 3->4 -->
      <polygon points="519,36 524,39 519,42" fill="#34d399" />
      <line x1="517" y1="39" x2="523" y2="39" stroke="#34d399" stroke-width="2" />

      <!-- Step 4 -->
      <g transform="translate(524, 0)">
        <rect width="162" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <circle cx="22" cy="20" r="11" fill="#047857"/>
        <text x="22" y="24" text-anchor="middle" fill="#ffffff" class="step-num">4</text>
        <text x="40" y="24" class="step-title">规范硬链接</text>
        <text x="12" y="44" class="step-desc">Jellyfin / Plex 规范</text>
        <text x="12" y="58" class="step-desc">S01E01 标准层级</text>
        <text x="12" y="70" class="step-desc" fill="#6ee7b7" font-weight="600">Zero-IO 零双倍空间</text>
      </g>

      <!-- Connector 4->5 -->
      <polygon points="690,36 695,39 690,42" fill="#34d399" />
      <line x1="688" y1="39" x2="694" y2="39" stroke="#34d399" stroke-width="2" />

      <!-- Step 5 -->
      <g transform="translate(695, 0)">
        <rect width="190" height="78" rx="8" fill="#022c22" stroke="#059669" stroke-width="1"/>
        <circle cx="22" cy="20" r="11" fill="#047857"/>
        <text x="22" y="24" text-anchor="middle" fill="#ffffff" class="step-num">5</text>
        <text x="40" y="24" class="step-title">媒体库即开即播</text>
        <text x="12" y="44" class="step-desc">API 触发刷新库</text>
        <text x="12" y="58" class="step-desc">Jellyfin / Emby / fnOS</text>
        <text x="12" y="70" class="step-desc" fill="#6ee7b7" font-weight="600">即整即播 / 体验丝滑</text>
      </g>
    </g>
  </g>

  <!-- ==================== ASYNC EVENT BUS ==================== -->
  <g transform="translate(32, 462)">
    <line x1="605" y1="0" x2="605" y2="20" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3,3" />
    <polygon points="602,18 605,23 608,18" fill="#f59e0b" />
    <rect x="475" y="3" width="260" height="18" rx="9" fill="#451a03" fill-opacity="0.9" stroke="#d97706" stroke-width="0.8"/>
    <text x="605" y="16" text-anchor="middle" font-family="monospace" font-size="10.5" font-weight="600" fill="#fbbf24">⚡ EventBus 异步事件解耦 (file.organized)</text>
  </g>

  <!-- ==================== LAYER 4: PLUGINS ==================== -->
  <g transform="translate(32, 488)">
    <rect width="916" height="84" rx="12" fill="#1e1b2e" fill-opacity="0.6" stroke="#b45309" stroke-width="1" />
    <text x="16" y="24" class="layer-title" fill="#fbbf24">4. 模块化扩展生态 (Pluggable Ecosystem - 具备完整资源释放与异常隔离保护)</text>
    <text x="896" y="24" text-anchor="end" font-family="monospace" font-size="11" fill="#f59e0b">停用即销毁协程 • 0 网络 • 0 垃圾日志</text>

    <!-- 4 Plugin Cards -->
    <g transform="translate(16, 34)">
      <rect x="0" y="0" width="210" height="38" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#78350f" stroke-width="0.8" />
      <text x="12" y="17" class="card-title">🔔 16 渠道消息推送中心</text>
      <text x="12" y="30" class="card-desc">TG/微信/飞书/Bark/邮件/Webhook</text>

      <rect x="224" y="0" width="210" height="38" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#78350f" stroke-width="0.8" />
      <text x="236" y="17" class="card-title">🏷️ Bangumi 本地 NFO 刮削</text>
      <text x="236" y="30" class="card-desc">自动下海报与演职员，摆脱网络封锁</text>

      <rect x="448" y="0" width="210" height="38" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#78350f" stroke-width="0.8" />
      <text x="460" y="17" class="card-title">💾 做种配额与死种检测</text>
      <text x="460" y="30" class="card-desc">分享率/时长达标清理，保护源文件</text>

      <rect x="672" y="0" width="210" height="38" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#78350f" stroke-width="0.8" />
      <text x="684" y="17" class="card-title">🌐 自定义 Webhook / 脚本</text>
      <text x="684" y="30" class="card-desc">Shell 钩子、外部归档与开放集成</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(32, 592)">
    <text x="458" y="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b">
      Ani-Go Architecture Standard • Pure Go Hexagonal Microkernel • Zero-IO Hardlink Engine
    </text>
  </g>
</svg>
