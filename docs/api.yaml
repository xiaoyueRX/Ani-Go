        '401': {$ref: '#/components/responses/LoginRequired'}

  /bangumi/auth/link:
    get:
      tags: [Bangumi]
      operationId: createBangumiAuthLink
      summary: 开始 Bangumi 账户绑定
      description: 在同一浏览器中打开返回的授权 URL。服务端同时设置一次性、仅回调路径可见的 HttpOnly 会话 Cookie。
      responses:
        '200':
          description: 开始 Bangumi 账户绑定
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: {type: string}
        '400':
          description: 请求格式或参数无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 服务执行或持久化失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/LoginRequired'}

  /bangumi/auth/callback:
    get:
      tags: [Bangumi]
      operationId: completeBangumiAuth
      summary: 接收 Bangumi 授权回调
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema: {type: string}
        - name: state
          in: query
          required: true
          schema: {type: string}
        - name: anigo_bangumi_flow
          in: cookie
          required: true
          schema: {type: string}
      responses:
        '302':
          description: 接收 Bangumi 授权回调
          headers:
            Location:
              schema: {type: string}
              description: 设置页的授权成功地址。
        '400':
          description: 请求格式或参数无效
          content:
            text/plain:
              schema: {type: string}
        '500':
          description: 服务执行或持久化失败
          content:
            text/plain:
              schema: {type: string}
        '502':
          description: 上游服务失败
          content:
            text/plain:
              schema: {type: string}

  /ai/models:
    post:
      tags: [Search]
      operationId: listAIModels
      summary: 查询指定 AI 服务支持的模型
      description: 端点调用失败通过 HTTP 200 的 success=false 返回。
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AIModelsRequest'}
      responses:
        '200':
          description: 查询指定 AI 服务支持的模型
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  models:
                    type: array
                    items: {type: string}
                  error: {type: string}
        '400':
          description: 请求格式或参数无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/LoginRequired'}

  /search/smart:
    post:
      tags: [Search]
      operationId: smartSearch
      summary: 聚合关键词扩展与多源搜索
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SmartSearchRequest'}
      responses:
        '200':
          description: 聚合关键词扩展与多源搜索
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SmartSearchResponse'}
        '400':
          description: 请求格式或参数无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '502':
          description: 上游服务失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 服务未配置或未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/LoginRequired'}

  /events/stream:
    get:
      tags: [Events]
      operationId: streamEvents
      summary: 订阅实时业务事件
      description: 连接后先发送 connected 帧，后续业务事件通过 data 帧返回，空闲时每 15 秒发送注释心跳。
      security:
        - BearerAuth: []
        - EventStreamJWT: []
      responses:
        '200':
          description: 订阅实时业务事件
          content:
            text/event-stream:
              schema: {type: string}
        '401':
          description: 登录凭据无效或过期
          content:
            text/plain:
              schema: {type: string}
        '500':
          description: 服务执行或持久化失败
          content:
            text/plain:
              schema: {type: string}
        '503':
          description: 账户存储暂时不可用，可在恢复后重连
          content:
            text/plain:
              schema: {type: string}

  /mcp/token/generate:
    post:
      tags: [MCP]
      operationId: rotateMcpToken
      summary: 生成并轮换 MCP 访问令牌
      responses:
        '200':
          description: 生成并轮换 MCP 访问令牌
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
        '500':
          description: 服务执行或持久化失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/LoginRequired'}

  /mcp/sse:
    servers:
      - url: /
        description: MCP 传输使用站点根路径。
    get:
      tags: [MCP]
      operationId: openMcpStream
      summary: 建立 MCP SSE 会话
      description: 首个 endpoint 事件给出会话的消息提交地址。RPC 结果在同一连接的 message 事件中返回。
      security:
        - McpBearer: []
        - McpQueryToken: []
      responses:
        '200':
          description: 建立 MCP SSE 会话
          content:
            text/event-stream:
              schema: {type: string}
        '401':
          description: 登录凭据无效或过期
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 服务执行或持久化失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 服务未配置或未就绪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}

  /mcp/messages:
    servers:
      - url: /
        description: MCP 传输使用站点根路径。
    post:
      tags: [MCP]
      operationId: submitMcpMessage
      summary: 提交 JSON-RPC 2.0 消息
      description: 接受后返回空响应，结果异步写入对应的 SSE 会话。请求体上限 1 MiB。
      security:
        - McpBearer: []
        - McpQueryToken: []
      parameters:
        - name: session_id
          in: query
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                jsonrpc:
                  type: string
                  enum: ['2.0']
                id:
                  oneOf:
                    - {type: string}
                    - {type: number}
                  nullable: true
                method: {type: string}
                params: {}
              required: [jsonrpc, method]
      responses:
        '202': {description: 提交 JSON-RPC 2.0 消息}
        '400':
          description: 请求格式或参数无效
          content:
            text/plain:
              schema: {type: string}
        '401':
          description: 登录凭据无效或过期
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 记录不存在
          content:
            text/plain:
              schema: {type: string}
        '413':
          description: 请求体超出大小限制
          content:
            text/plain:
              schema: {type: string}

  /user/avatar:
    get:
      tags: [User]
      operationId: getUserAvatar
      summary: 读取当前头像图片
      security: []
      responses:
        '200':
          description: 读取当前头像图片
          content:
            image/*:
              schema: {type: string, format: binary}
        '404':
          description: 记录不存在
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 服务执行或持久化失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      description: 支持 GET 与 HEAD。未带版本时读取当前头像；带 v 的版本 URL 只在该版本为当前版本时有效。
      parameters:
        - name: v
          in: query
          required: false
          schema: {type: string}
          description: 服务端返回的头像版本标识。
    post:
      tags: [User]
      operationId: uploadUserAvatar
      summary: 上传头像图片
      responses:
        '200':
          description: 上传头像图片
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: {type: boolean}
                  message: {type: string}
                  avatar_url: {type: string}
        '400':
          description: 请求格式或参数无效
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 服务执行或持久化失败
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/LoginRequired'}
        '413':
          description: 请求体超出大小限制
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar: {type: string, format: binary}
              required: [avatar]
      description: avatar 必须为 PNG、JPEG、WebP、GIF 或 SVG，扩展名与内容应匹配。上限 5 MiB，另允许 64 KiB multipart 封装；后续请原样使用返回的 avatar_url。
