<!doctype html>
<html lang="zh-CN" data-theme="anigo-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="shortcut icon" href="/favicon-32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Ani-Go - 全自动番剧追番管理系统</title>
    <script>
      try {
        var t = localStorage.getItem('ani-go-theme');
        if (t === 'anigo-light' || t === 'anigo-dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
        var p = localStorage.getItem('ani-go-theme-pack');
        var s = localStorage.getItem('ani-go-theme-style');
        if (p) document.documentElement.setAttribute('data-theme-pack', p);
        if (s) document.documentElement.setAttribute('data-theme-style', s);
        var varsRaw = localStorage.getItem('ani-go-theme-vars');
        var bgCol = t === 'anigo-light' ? '#f5f3ee' : '#09090b';
        if (varsRaw) {
          var vars = JSON.parse(varsRaw);
          if (vars && typeof vars === 'object') {
            for (var k in vars) {
              if (k.indexOf('--v2-') === 0 && typeof vars[k] === 'string') {
                document.documentElement.style.setProperty(k, vars[k]);
              }
            }
            if (typeof vars['--v2-bg'] === 'string') bgCol = vars['--v2-bg'];
          }
        }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', bgCol);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }
    </script>
  </body>
</html>
