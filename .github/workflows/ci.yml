name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ github.sha }}

  check-container:
    needs: verify
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: false

  publish-container:
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
