name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ github.sha }}
      upload-web: true

  platform:
    name: Runtime ${{ matrix.os }}/${{ matrix.arch }} (${{ matrix.runner }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and start the native application
        id: application
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go version
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$TARGET_OS/$TARGET_ARCH"
          binary="anigo$(go env GOEXE)"
          go build -trimpath -ldflags="-s -w -X main.version=ci-$GITHUB_SHA" -o "$binary" .
          if [[ "$TARGET_OS" == windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_platform_runtime.py "./$binary"
      - name: Edit a subscription while its background reader waits for SQLite
        run: go test -v -count=1 -run '^TestUpdateSubscriptionWhileFirstReadWaitsForConnection$' ./internal/database
      - name: Upgrade an official v0.7.0 installation and restore its data
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$TARGET_OS" == windows ]]; then py=python; else py=python3; fi
          legacy="$RUNNER_TEMP/anigo-v0.7.0$(go env GOEXE)"
          "$py" scripts/fetch_legacy_runtime.py --os "$TARGET_OS" --arch "$TARGET_ARCH" --output "$legacy"
          "$py" scripts/test_legacy_upgrade.py "./anigo$(go env GOEXE)" --legacy "$legacy"
      - name: Sign in and create a subscription in the native browser
        if: ${{ !cancelled() && steps.application.outcome == 'success' && (matrix.runner == 'windows-2025' || matrix.runner == 'macos-15') }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m venv .browser-venv
            python=.browser-venv/Scripts/python.exe
            browser=edge
          else
            python3 -m venv .browser-venv
            python=.browser-venv/bin/python
            browser=safari
            sudo /usr/bin/safaridriver --enable
          fi
          "$python" -m pip install --disable-pip-version-check -r scripts/requirements-browser.txt
          "$python" scripts/test_platform_browser.py "./anigo$(go env GOEXE)" --browser "$browser" \
            --legacy "$RUNNER_TEMP/anigo-v0.7.0$(go env GOEXE)"
      - name: Native Go tests
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: go test -count=1 -timeout=5m ./...
      - name: Exercise HTTP self-update and rollback
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: |
          py=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m venv .update-venv
            py=.update-venv/Scripts/python.exe
            "$py" -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.2.2
          fi
          "$py" scripts/test_update_runtime.py
      - name: Install aria2
        id: aria2
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: bash scripts/install_ci_aria2.sh
      - name: Download selected RSS episodes with aria2
        if: ${{ !cancelled() && steps.aria2.outcome == 'success' }}
        env:
          ARIA2C: ${{ steps.aria2.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_aria2_runtime.py "./anigo$(go env GOEXE)" --aria2c "$ARIA2C"
      - name: Install Transmission
        id: transmission
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: bash scripts/install_ci_transmission.sh
      - name: Resume selected RSS episodes and seed with Transmission
        if: ${{ !cancelled() && steps.transmission.outcome == 'success' }}
        env:
          TRANSMISSION_DAEMON: ${{ steps.transmission.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_transmission_runtime.py "./anigo$(go env GOEXE)" --daemon "$TRANSMISSION_DAEMON"
      - name: Install qBittorrent
        id: qb
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: bash scripts/install_ci_qbittorrent.sh
      - name: Transfer selected episodes between real qBittorrent peers
        if: ${{ !cancelled() && steps.qb.outcome == 'success' }}
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          file "$QB"
          "$py" scripts/test_qb_runtime.py "./anigo$(go env GOEXE)" --qbittorrent "$QB"
      - name: Restore two editions of a season with qBittorrent
        if: ${{ !cancelled() && steps.qb.outcome == 'success' }}
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_qb_edition_recovery.py "./anigo$(go env GOEXE)" --qbittorrent "$QB"
      - name: Copy across volumes and seed after restarting qBittorrent
        if: ${{ !cancelled() && steps.qb.outcome == 'success' && (matrix.os == 'windows' || matrix.os == 'darwin') }}
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/test_cross_volume_windows.ps1 -AniGo "$(cygpath -aw ./anigo.exe)" -QB "$(cygpath -aw "$QB")"
          else
            bash scripts/test_cross_volume_macos.sh ./anigo "$QB"
          fi
      - name: Export a complete native backup after organizing a real download
        id: portable
        if: ${{ !cancelled() && github.event_name == 'pull_request' && (matrix.runner == 'windows-2025' || matrix.runner == 'ubuntu-24.04') && steps.qb.outcome == 'success' }}
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_portable_backup.py export "./anigo$(go env GOEXE)" "$RUNNER_TEMP/portable-backup" --qbittorrent "$QB"
      - name: Share the native backup with the target operating systems
        if: ${{ !cancelled() && steps.portable.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}-portable-backup
          path: ${{ runner.temp }}/portable-backup/*.json
          if-no-files-found: error
          retention-days: 1
      - name: Restore the exported Windows backup into a fresh Windows Transmission instance
        if: ${{ !cancelled() && matrix.os == 'windows' && steps.portable.outcome == 'success' && steps.transmission.outcome == 'success' }}
        env:
          TRANSMISSION_DAEMON: ${{ steps.transmission.outputs.executable }}
        run: python scripts/test_transmission_runtime.py ./anigo.exe --daemon "$TRANSMISSION_DAEMON" --restore-windows-backup "$RUNNER_TEMP/portable-backup"
      - name: Restore the exported Windows backup and resume E02 with aria2
        if: ${{ !cancelled() && matrix.os == 'windows' && steps.portable.outcome == 'success' && steps.aria2.outcome == 'success' }}
        env:
          ARIA2C: ${{ steps.aria2.outputs.executable }}
        run: >-
          python scripts/test_aria2_runtime.py ./anigo.exe --aria2c "$ARIA2C"
          --restore-windows-backup "$RUNNER_TEMP/portable-backup"
      - name: Exercise the macOS installer
        if: ${{ !cancelled() && steps.application.outcome == 'success' && matrix.os == 'darwin' }}
        run: python3 scripts/test_install.py

  restore-windows-backup:
    name: Restore Windows backup on ${{ matrix.runner }}
    needs: platform
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.platform.result != 'skipped' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHON: ${{ startsWith(matrix.target, 'windows/') && 'python' || 'python3' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux/amd64 }
          - { runner: ubuntu-24.04-arm, target: linux/arm64 }
          - { runner: macos-15, target: darwin/arm64 }
          - { runner: windows-11-arm, target: windows/arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-portable-backup
          path: ${{ runner.temp }}/portable-backup
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build the native destination application
        id: application
        env:
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          go version
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$TARGET"
          go build -trimpath -ldflags="-s -w -X main.version=ci-$GITHUB_SHA" -o "anigo$(go env GOEXE)" .
      - name: Install qBittorrent
        id: qb
        run: bash scripts/install_ci_qbittorrent.sh
      - name: Restore the Windows archive and organize a new local download
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: >-
          "$PYTHON" scripts/test_portable_backup.py import "./anigo$(go env GOEXE)"
          "$RUNNER_TEMP/portable-backup" --require-source Windows --qbittorrent "$QB"
      - name: Download the Linux x64 archive on native Windows
        id: linux_backup
        if: ${{ !cancelled() && matrix.target == 'windows/arm64' && steps.qb.outcome == 'success' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-portable-backup
          path: ${{ runner.temp }}/linux-portable-backup
      - name: Restore the Linux archive twice on Windows and organize E02 locally
        if: ${{ !cancelled() && steps.linux_backup.outcome == 'success' }}
        env:
          QB: ${{ steps.qb.outputs.executable }}
        run: >-
          "$PYTHON" scripts/test_portable_backup.py import ./anigo.exe
          "$RUNNER_TEMP/linux-portable-backup" --require-source Linux --qbittorrent "$QB"
      - name: Install Transmission for the destination
        id: transmission
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: bash scripts/install_ci_transmission.sh
      - name: Restore the Windows backup into Transmission and seed the new episode after restart
        if: ${{ !cancelled() && steps.transmission.outcome == 'success' }}
        env:
          TRANSMISSION_DAEMON: ${{ steps.transmission.outputs.executable }}
        run: >-
          "$PYTHON" scripts/test_transmission_runtime.py "./anigo$(go env GOEXE)"
          --daemon "$TRANSMISSION_DAEMON" --restore-windows-backup "$RUNNER_TEMP/portable-backup"
      - name: Install aria2 for the destination
        id: aria2
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: bash scripts/install_ci_aria2.sh
      - name: Restore the Windows backup and resume E02 with aria2
        if: ${{ !cancelled() && steps.aria2.outcome == 'success' }}
        env:
          ARIA2C: ${{ steps.aria2.outputs.executable }}
        run: >-
          "$PYTHON" scripts/test_aria2_runtime.py "./anigo$(go env GOEXE)" --aria2c "$ARIA2C"
          --restore-windows-backup "$RUNNER_TEMP/portable-backup"

  check-container:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: false
      check_arch: ${{ matrix.arch }}

  publish-container:
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
