name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ github.sha }}
      upload-web: true

  platform:
    name: Runtime ${{ matrix.os }}/${{ matrix.arch }} (${{ matrix.runner }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows, arch: amd64, runner: windows-2025 }
          - { os: windows, arch: arm64, runner: windows-11-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: linux, arch: armv7, runner: ubuntu-24.04 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and start the native application
        id: application
        if: matrix.arch != 'armv7'
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          go version
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = "$TARGET_OS/$TARGET_ARCH"
          binary="anigo$(go env GOEXE)"
          go build -trimpath -ldflags="-s -w -X main.version=ci-$GITHUB_SHA" -o "$binary" .
          if [[ "$TARGET_OS" == windows ]]; then py=python; else py=python3; fi
          "$py" scripts/test_platform_runtime.py "./$binary"
      - name: Sign in and create a subscription in the native browser
        if: matrix.runner == 'windows-2025' || matrix.runner == 'macos-15'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m venv .browser-venv
            python=.browser-venv/Scripts/python.exe
            browser=edge
          else
            python3 -m venv .browser-venv
            python=.browser-venv/bin/python
            browser=safari
            sudo /usr/bin/safaridriver --enable
          fi
          "$python" -m pip install --disable-pip-version-check -r scripts/requirements-browser.txt
          "$python" scripts/test_platform_browser.py "./anigo$(go env GOEXE)" --browser "$browser"
      - name: Native Go tests
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: go test -count=1 -timeout=5m ./...
      - name: Exercise HTTP self-update and rollback
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: |
          py=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m venv .update-venv
            py=.update-venv/Scripts/python.exe
            "$py" -m pip install --disable-pip-version-check --only-binary=:all: psutil==7.2.2
          fi
          "$py" scripts/test_update_runtime.py
      - name: Download selected RSS episodes with aria2
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            py=python
            archive=aria2-1.37.0-win-64bit-build1.zip
            curl --fail --silent --show-error --location --output "$archive" "https://github.com/aria2/aria2/releases/download/release-1.37.0/$archive"
            echo "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288  $archive" | sha256sum --check
            unzip -q "$archive" -d "$RUNNER_TEMP"
            aria="$(cygpath -u "$RUNNER_TEMP")/${archive%.zip}/aria2c.exe"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            py=python3
            command -v aria2c >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install aria2
            aria=$(command -v aria2c)
          else
            py=python3
            if ! command -v aria2c >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends aria2
            fi
            aria=$(command -v aria2c)
          fi
          file "$aria"
          "$py" scripts/test_aria2_runtime.py "./anigo$(go env GOEXE)" --aria2c "$aria"
      - name: Resume selected RSS episodes and seed with Transmission
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: |
          py=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            py=python
            curl --fail --silent --show-error --location --output transmission.msi https://github.com/transmission/transmission/releases/download/4.1.4/transmission-4.1.4-x64.msi
            echo "cf51e5772f39a3ead3c8f763b689399b9b4b8b016a4c0ca68ab5d6c634be2e1c  transmission.msi" | sha256sum --check
            pwsh -NoProfile -Command '
              $out = Join-Path $env:RUNNER_TEMP transmission-files
              $msi = (Resolve-Path transmission.msi).Path
              $result = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$out`""
              exit $result.ExitCode'
            daemon=$(find "$(cygpath -u "$RUNNER_TEMP")/transmission-files" -iname transmission-daemon.exe -print -quit)
          elif [[ "$RUNNER_OS" == macOS ]]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install transmission-cli
            daemon="$(brew --prefix transmission-cli)/bin/transmission-daemon"
          else
            if ! command -v transmission-daemon >/dev/null; then
              sudo systemctl mask --runtime transmission-daemon.service
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends transmission-daemon
            fi
            daemon=$(command -v transmission-daemon)
          fi
          file "$daemon"
          "$py" scripts/test_transmission_runtime.py "./anigo$(go env GOEXE)" --daemon "$daemon"
      - name: Transfer selected episodes between real qBittorrent peers
        if: ${{ !cancelled() && steps.application.outcome == 'success' }}
        run: |
          py=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            py=python
            installer=qbittorrent_5.3.0_x64_setup.exe
            curl --fail --silent --show-error --location --output "$installer" "https://github.com/qbittorrent/qBittorrent/releases/download/release-5.3.0/$installer"
            echo "aff5b3bdc00d6e5773d6099ba30f9696dd3dfd1669ab0f64ce5c4e7168486436  $installer" | sha256sum --check
            pwsh -NoProfile -Command '$p = Start-Process .\qbittorrent_5.3.0_x64_setup.exe -ArgumentList /S -Wait -PassThru; exit $p.ExitCode'
            qb=$(pwsh -NoProfile -Command 'Join-Path $env:ProgramFiles qBittorrent/qbittorrent.exe' | tr -d '\r')
            qb=$(cygpath -u "$qb")
          elif [[ "$RUNNER_OS" == macOS ]]; then
            dmg=qbittorrent-5.2.3.dmg
            curl --fail --silent --show-error --location --output "$dmg" "https://github.com/qbittorrent/qBittorrent/releases/download/release-5.2.3/$dmg"
            echo "9e37f6c7ff848c7bdd3c10167614c0cb78c00e2ddcc323f1ad3ac6c008a0481f  $dmg" | shasum -a 256 --check
            volume="$RUNNER_TEMP/qb-volume"
            mkdir "$volume"
            hdiutil attach -readonly -nobrowse -mountpoint "$volume" "$dmg"
            trap 'hdiutil detach "$volume"' EXIT
            qb=$(find "$volume" -path '*/Contents/MacOS/qbittorrent' -type f -print -quit)
            lipo -archs "$qb"
          else
            if ! command -v qbittorrent-nox >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends qbittorrent-nox
            fi
            qb=$(command -v qbittorrent-nox)
          fi
          file "$qb"
          "$py" scripts/test_qb_runtime.py "./anigo$(go env GOEXE)" --qbittorrent "$qb"
      - name: Test direct ARMv7 execution and downloaders on the ARM64 host
        if: ${{ !cancelled() && steps.application.outcome == 'success' && matrix.os == 'linux' && matrix.arch == 'arm64' }}
        run: |
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=ci-$GITHUB_SHA" -o anigo-armv7 .
          python3 scripts/probe_armv7_runtime.py ./anigo-armv7 --downloaders
      - name: Exercise the macOS installer
        if: ${{ !cancelled() && steps.application.outcome == 'success' && matrix.os == 'darwin' }}
        run: python3 scripts/test_install.py
      - name: Build and start the ARMv7 application with QEMU
        if: matrix.arch == 'armv7'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user
          qemu-arm --version
          GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=ci-$GITHUB_SHA" -o anigo .
          python3 scripts/test_platform_runtime.py --runner qemu-arm ./anigo

  check-container:
    needs: verify
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: false

  publish-container:
    needs: verify
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ github.sha }}
      publish: true
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
