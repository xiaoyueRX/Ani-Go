name: Container image

on:
  workflow_call:
    inputs:
      revision:
        type: string
        required: true
      publish:
        type: boolean
        required: true
      check_arch:
        description: Native architecture for the PR container check
        type: string
        default: amd64
      version:
        type: string
        default: ''
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false

jobs:
  image:
    runs-on: ${{ inputs.publish && 'ubuntu-latest' || inputs.check_arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - name: Configure image names
        id: names
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          MAIN_BUILD: ${{ inputs.publish && inputs.version == '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$MAIN_BUILD" == true ]]; then
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
            if [[ "$head" == "$(git rev-parse HEAD)" ]]; then echo 'main=true' >> "$GITHUB_OUTPUT"; fi
          fi
          if [[ -n "$HUB_USER" && -n "$HUB_TOKEN" ]]; then
            echo "hub=$HUB_USER/ani-go" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ steps.names.outputs.hub }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ steps.names.outputs.short_sha }},enable=${{ inputs.version == '' }}
            type=raw,value=main,enable=${{ steps.names.outputs.main == 'true' }}
            type=raw,value=latest,enable=${{ steps.names.outputs.main == 'true' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.publish
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: inputs.publish
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Log in to Docker Hub
        if: inputs.publish && steps.names.outputs.hub != ''
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ inputs.publish && 'linux/amd64,linux/arm64' || format('linux/{0}', inputs.check_arch) }}
          push: ${{ inputs.publish }}
          load: ${{ !inputs.publish }}
          build-args: APP_VERSION=${{ inputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha
            ${{ !inputs.publish && format('type=gha,scope=container-check-{0}', inputs.check_arch) || '' }}
          cache-to: ${{ inputs.publish && 'type=gha,mode=max' || format('type=gha,scope=container-check-{0},mode=max', inputs.check_arch) }}
      - name: Verify native image, embedded UI, login and data after recreation
        if: ${{ !inputs.publish }}
        env:
          IMAGE_ID: ${{ steps.build.outputs.imageid }}
          CHECK_ARCH: ${{ inputs.check_arch }}
        run: python3 scripts/test_container_runtime.py "$IMAGE_ID" --arch "$CHECK_ARCH"
