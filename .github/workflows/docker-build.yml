name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- 测试 ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: 构建前端
        working-directory: web
        run: npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: true

      - name: 运行 Go 测试
        run: go test ./... -v

  # ---- 构建与推送 ----
  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      # 检查是否配置了 Docker Hub 凭据
      - name: 检查 Docker Hub 配置
        id: dockerhub-check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
            echo "image=${{ secrets.DOCKERHUB_USERNAME }}/ani-go" >> $GITHUB_OUTPUT
            echo "Docker Hub 凭据已检测到，将同时推送到 Docker Hub: ${{ secrets.DOCKERHUB_USERNAME }}/ani-go"
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "image=" >> $GITHUB_OUTPUT
            echo "未配置 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，仅推送到 GHCR"
          fi

      # Docker 元数据（多仓库标签与注解）
      - name: Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub-check.outputs.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # QEMU（arm64 模拟）
      - name: 安装 QEMU
        uses: docker/setup-qemu-action@v3

      # Buildx（多架构构建）
      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 GHCR
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 登录 Docker Hub (如果配置了 DOCKERHUB_USERNAME 与 DOCKERHUB_TOKEN)
      - name: 登录 Docker Hub
        if: steps.dockerhub-check.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建并推送多架构镜像（同时支持 GHCR 和 Docker Hub）
      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
