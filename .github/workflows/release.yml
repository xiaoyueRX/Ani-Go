name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag (e.g. v0.7.0). Leave empty to use the selected tag or the version declared in main.go.
        type: string
        required: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      revision: ${{ steps.resolve.outputs.revision }}
      series: ${{ steps.resolve.outputs.series }}
      historical-rebuild: ${{ steps.resolve.outputs.historical-rebuild }}
      package-targets: ${{ steps.resolve.outputs.package-targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          REQUESTED_TAG: ${{ inputs.tag_name }}
        run: |
          tag=$REQUESTED_TAG
          if [[ -z "$tag" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              tag=$GITHUB_REF_NAME
            else
              tag=$(sed -n 's/^var version = "\([^"]*\)"$/\1/p' main.go)
            fi
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          revision=$(git rev-parse --verify "refs/tags/${tag}^{commit}")
          if [[ "$GITHUB_EVENT_NAME" == push && "$revision" != "$(git rev-parse HEAD)" ]]; then
            echo "::error::Release tag changed after the push"
            exit 1
          fi
          # These already-published snapshots predate the UI and docs checks.
          historical=false
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            case "$tag@$revision" in
              v0.3.0@8857d7a6beac01a5e8616a313aabe89b053ea43e|\
              v0.3.1@e3238a1efce670742eafa5c243e5750b507e6a19|\
              v0.3.5@69a476e053f7a1f19ef9e2d04078b1d1574938bc|\
              v0.6.0@807f69e8b3eb5dd22c44977ed3f57c4b79211b07|\
              v0.7.0@5dffa53f606fbc606bd5922f3c1e436dd64fe187) historical=true ;;
            esac
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          version=${tag#v}
          echo "series=${version%.*}" >> "$GITHUB_OUTPUT"
          echo "historical-rebuild=$historical" >> "$GITHUB_OUTPUT"
          targets=(linux-amd64 linux-arm64 darwin-arm64 windows-amd64 windows-arm64)
          if [[ "$historical" == true ]]; then targets+=(linux-armv7 darwin-amd64); fi
          target_json=$(jq -cn --args '$ARGS.positional' "${targets[@]}")
          echo "package-targets=$target_json" >> "$GITHUB_OUTPUT"

  verify:
    needs: source
    uses: ./.github/workflows/check.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      upload-web: true
      historical-rebuild: ${{ needs.source.outputs.historical-rebuild == 'true' }}

  image:
    needs: [source, verify]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      revision: ${{ needs.source.outputs.revision }}
      publish: true
      version: ${{ needs.source.outputs.tag }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  package:
    name: Package ${{ matrix.target }}
    needs: [source, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.source.outputs.package-targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and archive binary
        env:
          TAG: ${{ needs.source.outputs.tag }}
          TARGET: ${{ matrix.target }}
          CGO_ENABLED: '0'
          HISTORICAL_REBUILD: ${{ needs.source.outputs.historical-rebuild }}
        run: |
          name="ani-go-$TAG-$TARGET"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage" packages
          export GOOS="${TARGET%-*}" GOARCH="${TARGET#*-}"
          binary=anigo
          if [[ "$GOOS" == windows ]]; then binary=anigo.exe; fi
          if [[ "$GOARCH" == armv7 ]]; then export GOARCH=arm GOARM=7; fi
          go build -trimpath -ldflags="-s -w -X main.version=$TAG" -o "$stage/$binary" .
          cp .env.example README.md README_EN.md "$stage/"
          if [[ "$HISTORICAL_REBUILD" != true || -f LICENSE ]]; then cp LICENSE "$stage/"; fi
          if [[ "$GOOS" == windows ]]; then
            (cd "$RUNNER_TEMP" && zip -qr "$GITHUB_WORKSPACE/packages/$name.zip" "$name")
          else
            tar -C "$RUNNER_TEMP" -czf "packages/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: packages/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: [source, package, image]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.package.result == 'success' &&
      ((github.event_name == 'push' && needs.image.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && needs.image.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-${{ needs.source.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.source.outputs.tag }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: packages
          merge-multiple: true
      - name: Verify packages and archive the tagged source
        env:
          TAG: ${{ needs.source.outputs.tag }}
          REVISION: ${{ needs.source.outputs.revision }}
          PACKAGE_TARGETS: ${{ join(fromJSON(needs.source.outputs.package-targets), ' ') }}
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          for target in $PACKAGE_TARGETS; do
            if [[ "$target" == windows-* ]]; then
              unzip -tq "packages/ani-go-$TAG-$target.zip"
            else
              gzip -t "packages/ani-go-$TAG-$target.tar.gz"
            fi
          done
          git archive --format=tar.gz --prefix="ani-go-$TAG-source/" -o "packages/ani-go-$TAG-source.tar.gz" HEAD
          git archive --format=zip --prefix="ani-go-$TAG-source/" -o "packages/ani-go-$TAG-source.zip" HEAD
          (cd packages && sha256sum -- *.tar.gz *.zip > checksums.txt && sha256sum --check checksums.txt)
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            cat > "$RUNNER_TEMP/release.md" <<NOTE
          ### Docker 镜像
          \`\`\`bash
          docker pull ghcr.io/${GITHUB_REPOSITORY,,}:$TAG
          \`\`\`

          NOTE
          fi
          cat >> "$RUNNER_TEMP/release.md" <<NOTE
          ### SHA-256
          在下载目录运行 \`sha256sum --ignore-missing -c checksums.txt\` 核对发行包。
          NOTE
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.source.outputs.tag }}
          target_commitish: ${{ needs.source.outputs.revision }}
          name: Ani-Go ${{ needs.source.outputs.tag }}
          body_path: ${{ runner.temp }}/release.md
          files: packages/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.source.outputs.tag, '-') }}
          make_latest: ${{ contains(needs.source.outputs.tag, '-') && 'false' || 'legacy' }}

  promote-image:
    name: Update minor version image
    needs: [source, publish]
    if: github.event_name == 'push' && !contains(needs.source.outputs.tag, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: image-series-${{ needs.source.outputs.series }}
    steps:
      - name: Update the alias to the highest published patch
        env:
          SERIES: ${{ needs.source.outputs.series }}
          GH_TOKEN: ${{ github.token }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          version=$(awk -F. -v series="v$SERIES" '($1 "." $2) == series && NF == 3 && $3 ~ /^[0-9]+$/ { print }' \
            <<< "$releases" | sort -V | tail -1)
          test -n "$version"
          images=("ghcr.io/${GITHUB_REPOSITORY,,}")
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [[ -n "$HUB_USER" && -n "$HUB_TOKEN" ]]; then
            echo "$HUB_TOKEN" | docker login --username "$HUB_USER" --password-stdin
            images+=("$HUB_USER/ani-go")
          fi
          for image in "${images[@]}"; do
            docker buildx imagetools create --tag "$image:$SERIES" "$image:${version#v}"
          done
